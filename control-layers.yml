# control-layers.yml — Oracle 19c STIG control -> implementation-layer map.
#
# Filed from the aws-broker Oracle 19c epic (cloud-gov/aws-broker#519, WS12/13
# #530); fills the overlay gap tracked in
# cloud-gov/cg-oracle-database-19c-stig-overlay#1.
#
# STATUS: DRAFT / STARTER MAP. The overlay now has an in-repo InSpec `controls/`
# directory (it `include_controls` all baseline controls), but no consumer reads
# this file yet; the `when_check_contains` patterns are written against the
# expected upstream control text and MUST be validated against the
# actual profile controls before this file is authoritative. Do not treat
# classifications here as final until a test asserts each control resolves to
# exactly one (set_by, verified_by) pair. See #1.
#
# PURPOSE: on managed AWS RDS, a large fraction of the Oracle 19c STIG is NOT a
# SQL-remediation — it is satisfied by the platform, by an RDS parameter/option
# group, or is simply not applicable (no OS/listener access). Without this map the
# InSpec profile fails or misleads on RDS (e.g. `ps -ef | grep tnslsnr`).
#
# TWO-AXIS MODEL (important): a control has a `set_by` (who APPLIES it) and a
# `verified_by` (who can CHECK it). These are NOT the same. audit_trail is SET BY
# the RDS parameter group but is still VERIFIED BY SQL (V$PARAMETER). Classifying a
# control's set_by as parameter-group must NEVER suppress a SQL verification that
# is possible — otherwise a real, detectable drift would be silently dropped.
#
# set_by / verified_by values:
#   broker_infra            broker sets it at provision (encryption, private, backups)
#   aws_rds_parameter_group broker parameter group sets it (audit_trail, etc.)
#   aws_rds_option_group    broker option group sets it
#   sql_hardening           remediated by hardening/sql/*
#   sql                     verifiable via SQL (oracledb_session) even if set elsewhere
#   sql_assessment_only     checkable in SQL, but change is detect-first (PUBLIC grants)
#   aws_inherited           satisfied by the AWS/RDS platform (host/OS/patching)
#   not_applicable_rds      cannot apply/verify on managed RDS (no OS/listener access)
#   manual_review           requires human/organizational review
#   compensating_control    met by a documented compensating control
#   blocked                 cannot be met on RDS; POA&M candidate
#
# PLATFORM vs. CUSTOMER RESPONSIBILITY: this map is the PLATFORM-side disposition
# (who APPLIES / who VERIFIES). For the customer-vs-platform determination and the
# list of customer-responsibility controls, see docs/RESPONSIBILITY.md.
#
# RULE PRECEDENCE (explicit): an entry in `controls:` (matched by id_pattern OR
# text_pattern) ALWAYS overrides `default_layer_rules`. Among `default_layer_rules`,
# first match wins in listed order. A control that matches nothing defaults to
# set_by=unknown, verified_by=sql (fail-safe: keep checking it in SQL).

metadata:
  status: draft
  stig: "Oracle Database 19c STIG"
  # NOTE: benchmark_version is UNVERIFIED against a specific DISA release artifact.
  # Confirm the exact DISA Oracle Database 19c STIG version + release date and cite
  # the benchmark filename before treating this as authoritative (#1).
  benchmark_version: "unverified"
  benchmark_citation_needed: true
  platform: "aws-rds-oracle-19c"
  partition_note: "GovCloud (aws-us-gov); verify option/param availability per region."
  source_epic: "https://github.com/cloud-gov/aws-broker/issues/519"

# Pattern rules applied to controls not explicitly listed below. First match wins.
# `when_check_contains` matches against the control's InSpec check text / describe
# block. Patterns constrained to reduce false matches (e.g. `command(`/`file(`
# alone are too broad and are intentionally NOT used as sole triggers).
default_layer_rules:
  - when_check_contains: ["tnslsnr", "lsnrctl", "listener.ora", "sqlnet.ora"]
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      Listener/sqlnet-level. On managed RDS the tenant has no OS or listener
      access; the listener is AWS-managed. Neither settable nor SQL-verifiable by
      the tenant → report not applicable / inherited.
  - when_check_contains: ["ps -ef", "/etc/oratab", "$ORACLE_HOME/", "audit.rules", "chmod", "chown"]
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      OS/filesystem-level check requiring host access. The underlying host is
      AWS-managed on RDS; satisfied by inherited controls, not tenant-checkable.
  - when_check_contains: ["oracledb_session"]
    set_by: sql_hardening
    verified_by: sql
    rationale: Default for SQL-connectable controls not otherwise classified.

# Explicit per-control overrides (authoritative over default rules; extend during
# the dev proof). Each has set_by (who applies) + verified_by (who can check).
controls:
  # --- parameter-group SET, but SQL VERIFIABLE (do NOT drop the check) ---
  - text_pattern: "audit_trail"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      audit_trail is applied by the broker parameter group but is readable via
      SELECT value FROM v$parameter — keep verifying it in SQL to detect drift.
  - text_pattern: "sec_case_sensitive_logon"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: Set by parameter group; verifiable in V$PARAMETER.
  - text_pattern: "remote_login_passwordfile"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      SV-270526 (CM-6 b) REMOTE_LOGIN_PASSWORDFILE must be EXCLUSIVE or NONE. Set
      by the broker RDS parameter group (aws-broker
      services/rds/baselines/oracle19c/parameters.yml sets
      remote_login_passwordfile=NONE, apply_method pending-reboot) and verifiable
      in V$PARAMETER — keep verifying in SQL to detect drift. The DISA check's
      second part (OS permissions on the password file) is OS/filesystem and
      unreachable on managed RDS (password file is AWS-managed); that portion is
      not_applicable_rds while the parameter assertion remains SQL-verified. The
      baseline stub was unwritten (needs_dev); implemented the parameter SQL
      assertion upstream in the mitre-baseline
      (fix/sv-270526-remote-login-passwordfile-sql, held for PR), modeled on
      SV-270524/525 — baseline_status: fixed. Overlay inherits as-is
      (overlay_status: inherited).
  - text_pattern: "sql92_security"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      SV-270525 (SQL92_SECURITY=TRUE). Set by the broker RDS parameter group
      (aws-broker services/rds/baselines/oracle19c/parameters.yml sets
      sql92_security=TRUE, apply_method pending-reboot) and verifiable in
      V$PARAMETER — keep verifying in SQL to detect drift. Overlay inherits the
      baseline control as-is (overlay_status: inherited).
  - id_pattern: "SV-270524"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270524 (REMOTE_OS_ROLES=FALSE). REMOTE_OS_ROLES ships FALSE by Oracle
      default (the DISA fix only has to ACT when a site has turned it on), so on
      brokered RDS the compliant posture is inherited from the Oracle default —
      the broker does not need to override it. It is NOT currently pinned in the
      broker parameter group (parameters.yml), so it is classified aws_inherited
      (Oracle default) rather than aws_rds_parameter_group. It remains fully
      SQL-verifiable via V$PARAMETER, and the inherited baseline control's
      `should cmp 'FALSE'` assertion is correct and runs in BOTH postures to
      detect drift — never suppressed (two-axis rule). Overlay inherits as-is
      (overlay_status: inherited). FOLLOW-UP: pin remote_os_roles=FALSE
      explicitly in parameters.yml for defense-in-depth (aws-broker#574).

  # --- broker infra SET, verified from AWS metadata (not SQL) ---
  - text_pattern: "tablespace encryption|encrypted|TDE|at rest"
    set_by: broker_infra
    verified_by: aws_inherited
    rationale: >-
      Storage encryption at rest is enabled by the broker (encrypted:true, KMS) at
      provision; validated from AWS metadata, not SQL.

  # --- encryption IN TRANSIT (SC-8 / SC-8(1) / SC-13) — broker SSL option group ---
  # RDS Oracle TLS is a TCPS listener (port 2484) provisioned via the SSL option
  # group (TLS 1.2, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, FIPS.SSLFIPS_140=TRUE).
  # These live in sqlnet.ora / fips.ora, which are AWS-managed on RDS and NOT
  # tenant-SQL-visible — evidence is the option-group config + AWS metadata, plus a
  # client-side TCPS handshake, not a SQL query. See aws-broker#538 / options.yml.
  # NOTE: the SSL-only posture also depends on the platform security group allowing
  # 2484 and denying 1521 (aws-broker#541); until then the cleartext path remains.
  - text_pattern: "during transmission|SSLFIPS_140|SQLNET.SSL_VERSION|TCPS|SSL_SERVER_DN_MATCH|encrypt.*transmission|transmission.*encrypt"
    set_by: aws_rds_option_group
    verified_by: not_applicable_rds
    rationale: >-
      SC-8/SC-8(1) (in transit) + SC-13 (FIPS crypto) satisfied by the broker SSL
      option group — TLS 1.2, FedRAMP+FIPS cipher, FIPS.SSLFIPS_140=TRUE on a TCPS
      2484 listener. sqlnet.ora/fips.ora are AWS-managed on RDS (not SQL-visible);
      evidenced by option-group config + a client TCPS handshake. DISA Oracle 19c
      STIG V-270579 (SC-8(2)) + V-270571 (SC-13). Depends on platform SG (2484
      open / 1521 denied) for a true TLS-only posture (aws-broker#541).

  - text_pattern: "audit trail data must be retained|retention"
    set_by: manual_review
    verified_by: manual_review
    rationale: >-
      Log retention is an operational/CloudWatch policy decision; manual review
      against the CloudWatch log-group retention config.

  # --- platform-layer remediation, SQL VERIFIABLE (do NOT drop the check) ---
  - id_pattern: "SV-270497"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      SV-270497 (AC-12) automatic idle-session termination. Remediated at the
      PLATFORM layer via the RDS DB parameter group: max_idle_time is a
      modifiable, dynamic parameter (confirmed 2026-08-19 in GovCloud
      us-gov-west-1 via `aws rds describe-engine-default-parameters
      --db-parameter-group-family oracle-se2-19 --region us-gov-west-1` →
      IsModifiable=true, ApplyType=dynamic, AllowedValues 0-2147483647). On RDS
      the value is set through the parameter group, NOT `ALTER SYSTEM` (RDS locks
      down SYS), so no SQL hardening script ships here. SQL-verified via
      GV$PARAMETER (name = 'max_idle_time'). The minutes value is
      organization-defined (STIG assumes 15 when undocumented).
  - text_pattern: "FAILED_LOGIN_ATTEMPTS|PASSWORD_LIFE_TIME|password.*lifetime|profile limit"
    set_by: sql_hardening
    verified_by: sql
    rationale: Profile limits enforced by hardening/sql/10_profiles.sql.
  - id_pattern: "SV-270504"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      SV-270504 (AU-12 c) generate audit records for the DOD-selected list of
      auditable events. The generic mitre-baseline control is a Manual Review
      because the DOD event set is organization-defined/documentable with no single
      portable SQL predicate. On managed RDS the audit-policy posture is
      SQL-verifiable in two layers, and the overlay OVERRIDES the baseline Manual
      Review with in-place SQL assertions (controls/overlay.rb) that the required
      policies are ENABLED (present in AUDIT_UNIFIED_ENABLED_POLICIES); detect-first,
      never applied by this control.
      LAYER 1 (platform, both postures): the Oracle-provided policies
      ORA_SECURECONFIG (privilege GRANT, security-config/DDL, account administration
      CREATE/ALTER/DROP USER, ALTER SYSTEM/DATABASE) and ORA_LOGON_FAILURES (LOGON)
      are enabled BY DEFAULT on RDS once the broker's audit_trail parameters are set
      (the RDS parameter group) — no tenant step. Asserted via the
      required_audit_policies input (default ORA_SECURECONFIG / ORA_LOGON_FAILURES).
      LAYER 2 (customer, --all posture only): the STIG-required events the RDS
      defaults MISS — REVOKE, CHANGE PASSWORD, LOGOFF, CREATE SPFILE — are
      covered by a tenant-owned policy (CG_AUDIT_POLICY) created
      and enabled by hardening/sql/30_audit_policies.sql. Asserted via the
      org-defined customer_audit_policies input (default CG_AUDIT_POLICY) only when
      skip_customer_responsibility_controls is false; an empty list skips (does not
      fail) the customer assertion. Enabling CG_AUDIT_POLICY is customer-
      responsibility remediation. A site that uses a different policy name sets the
      customer_audit_policies default in inspec.yml (the runner is baked into the
      image, so inputs are not supplied at runtime). NO aws-broker
      step is required beyond routing audit_trail to a DB destination, already set
      by the parameter group.
  - text_pattern: "unified audit|audit policy|ORA_SECURECONFIG|ORA_LOGON_FAILURES"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      Unified audit policies ORA_SECURECONFIG / ORA_LOGON_FAILURES are enabled by
      default on RDS for Oracle once the broker's audit_trail parameters are set
      (RDS parameter group); SQL-verified via AUDIT_UNIFIED_ENABLED_POLICIES. The
      events those defaults MISS (REVOKE, CHANGE PASSWORD, LOGOFF, CREATE SPFILE)
      are added by hardening/sql/30_audit_policies.sql via
      the tenant-owned CG_AUDIT_POLICY — customer-responsibility remediation
      asserted only in the --all posture (see the SV-270504 id_pattern above).
  - text_pattern: "instance name.*version|Oracle version number|V\\$INSTANCE"
    set_by: aws_inherited
    verified_by: sql
    rationale: Version is AWS-managed but readable via V$INSTANCE/V$VERSION.
  - id_pattern: "SV-270553"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270553 (CM-7 a) unused DBMS components/software/objects must be removed.
      The DISA check lists installed components (dba_registry, excluding the core
      comp_ids CATJAVA/CATALOG/CATPROC/SDO/DV/XDB and OPTION OFF rows) and is a
      finding only if an installed component is unused and NOT documented/
      authorized — an organization-defined determination with no fixed SQL
      predicate (the generic baseline is a pending-assessment skip). On managed RDS
      the component set is fixed at database CREATION (DBCA component selection),
      which AWS owns, and is not tenant-removable: a brokered instance ships Oracle
      Text (CONTEXT) installed and VALID and the tenant cannot deselect it, so the
      installed set is inherited from the AWS provisioning default (aws_inherited).
      It remains SQL-verifiable, so the overlay OVERRIDES the baseline pending-skip
      with an in-place SQL assertion (controls/overlay.rb, SV-270504 overlay-sql
      pattern): run the DISA query and FAIL on any returned comp_id not in the
      org-defined authorized_components allowlist (default CONTEXT — the RDS
      default-installed component, documented and authorized). Detect-first:
      removal is not possible on RDS; the assertion flags any unauthorized/
      undocumented component for review. Runs in BOTH postures. overlay_status:
      overlay-sql.

  # --- detect-first (assessment only; never auto-remediated) ---
  - id_pattern: "SV-270510"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      SV-270510 (AU-9) protect the audit store from unauthorized access. Because
      the broker sets audit_trail=DB,EXTENDED (aws-broker
      services/rds/baselines/oracle19c/parameters.yml — DB destination = STANDARD
      auditing → AUD$), audit records live IN the database and the DISA check's
      SQL portion IS verifiable: enumerate object grants on the audit store
      (DBA_TAB_PRIVS on AUD$ for standard auditing, on AUDSYS-owned tables for
      unified auditing) and fail on any grantee outside the org-defined
      allowed_audit_users allowlist. The OS-level portions (audit_file_dest
      directory perms, %ORACLE_HOME% comparison) are not_applicable_rds. The SQL
      check was written upstream in the mitre-baseline (baseline_status: fixed),
      so the overlay inherits it as-is (overlay_status: inherited).
      AUDITING MODE: RDS for Oracle runs UNIFIED auditing in MIXED mode (pure mode
      needs a binary relink with uniaud_on, unsupported on RDS — AWS "Security
      auditing in Amazon RDS for Oracle, Part 1"). The overlay therefore sets
      standard_auditing_used=false / unified_auditing_used=true so SV-270510
      assesses the UNIFIED store (AUDSYS-owned AUD$UNIFIED / *UNIFIED_AUDIT_TRAIL).
      allowed_audit_users defaults to the Oracle built-in audit roles
      (EXECUTE_CATALOG_ROLE, AUDIT_ADMIN, AUDIT_VIEWER) + RDSADMIN; run-validation.sh
      appends the connecting broker DB_USER (per-instance name).
      KNOWN DEVIATION (accepted): on RDS the master/broker user is granted SELECT
      and DELETE on AUD$UNIFIED by the RDS-default unified-audit setup. DELETE on
      the audit store is an AU-9 concern, but it is an RDS platform default the
      tenant cannot REVOKE (AWS manages AUDSYS on RDS); accepted as a documented
      deviation (allowlisted by grantee), not a remediable finding. Any grantee
      OUTSIDE the allowlist is still a real finding.
      NO aws-broker remediation step is required: (1) the only platform action —
      routing audit to a DB destination — is already set by the parameter group
      above; (2) a stock RDS instance grants AUDSYS access only to the built-in
      audit roles, RDSADMIN, and the master user, so it passes with the default
      allowlist (this is detect-first, not applied); (3) the DISA fix is
      REVOKE ... FROM <grantee> — db-altering SQL against an org-defined grantee
      list (the SV-270495 customer-responsibility pattern, remediated via
      hardening/sql/, not the broker), and on RDS AUDSYS is AWS-managed so the
      broker could not run it at provision anyway.
  - id_pattern: "SV-270517"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270517 (CM-5(6)) DBMS software directories/config files must be stored in
      dedicated directories or DASD pools, separate from the host OS and other
      applications. The DISA check is a filesystem/host review (inspect the DBMS
      software library directory and its disk/DASD neighbors for shared non-DBMS
      software) and the fix relocates other applications off that directory — both
      require OS/filesystem access the tenant does not have on managed RDS (Oracle
      Home, directory layout, and disk/DASD placement are AWS-managed and
      unreachable; no other tenant application shares the RDS host). The inherited
      baseline body is a manual-review skip (no SQL). Overlay OVERRIDES to N/A
      (impact 0.0) in BOTH postures (controls/overlay.rb). Placed as an explicit
      id_pattern before the broad "$ORACLE_HOME/" default so it is unambiguous.
      overlay_status: N/A (platform).
  - id_pattern: "SV-270531"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270531 (CM-6 b) the Oracle Listener must require administration
      authentication (CAT I). The DISA check is OS/listener-level: it is Not a
      Finding when no listener runs on the local host, and otherwise enumerates
      host listener processes (ps -ef | grep tnslsnr, Windows TNSListener
      services) and runs lsnrctl status on the host to read the Security value;
      the fix relies on local OS authentication of the listener-owner account. On
      managed RDS the listener is AWS-managed and runs on the AWS-controlled host —
      the tenant has no OS/listener access and cannot run ps/lsnrctl or administer
      the listener. The inherited baseline command('ps ... tnslsnr') /
      command('lsnrctl status') assertions reflect the InSpec runner host (no
      listener), producing a misleading result. Overlay OVERRIDES to N/A
      (impact 0.0) in BOTH postures (controls/overlay.rb). Placed as an explicit
      id_pattern before the broad tnslsnr/lsnrctl default so it is unambiguous.
      overlay_status: N/A (platform).
  - id_pattern: "SV-270528"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270528 (CM-6 b) system privileges must not be granted to PUBLIC. The
      DISA check is a pure SQL predicate (SELECT privilege FROM dba_sys_privs
      WHERE grantee = 'PUBLIC'; ANY row is a finding), and the DISA fix note
      states system privileges are NOT granted to PUBLIC by default — a compliant
      stock database returns zero rows, so the compliant posture is inherited from
      the Oracle default (aws_inherited) with no org-defined value and no allowlist
      needed. The baseline control's `should be_empty` assertion is correct
      (baseline_status: fixed) and runs in BOTH postures to detect drift; it is
      never suppressed (two-axis rule). Overlay inherits as-is
      (overlay_status: inherited). Distinct from SV-270530 (object grants), which
      DOES need an org-defined allowlist and is a customer responsibility.
  - id_pattern: "SV-270530"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270530 (CM-6 b) object permissions granted to PUBLIC must be restricted.
      INHERITED with a platform-seeded allowlist (NOT customer responsibility).
      Unlike SV-270528/532 (which must be empty), the DISA check EXCLUDES Oracle
      product accounts via a "list of nonapplicable accounts" — an org-defined
      allowlist the baseline models with the users_allowed_access_to_public input
      (baseline_status: ok). On a stock brokered RDS instance the owners that hold
      PUBLIC object grants are the Oracle predefined product accounts (SYS, SYSTEM,
      CTXSYS, GSMADMIN_INTERNAL, XDB) PLUS the AWS-managed RDSADMIN platform
      account (confirmed against a provisioned RDS instance:
      `select distinct owner from dba_tab_privs where grantee='PUBLIC'` returned
      SYS, SYSTEM, CTXSYS, GSMADMIN_INTERNAL, RDSADMIN, XDB). Seeding those product
      + platform accounts into the allowlist so a stock brokered instance passes is
      a PLATFORM responsibility — done in runner/run-validation.sh — so the overlay
      inherits the baseline control as-is and it runs in BOTH postures. Any OTHER
      owner granting to PUBLIC (e.g. a customer application schema) is still a real
      finding the tenant must REVOKE; hardening/sql/40_public_grants_assess.sql is
      detect-first for that. overlay_status: inherited.
  - id_pattern: "SV-270532"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270532 (CM-6 b) application role permissions must not be assigned to the
      Oracle PUBLIC role. The DISA check is a pure SQL predicate (SELECT
      granted_role FROM dba_role_privs WHERE grantee = 'PUBLIC'; ANY row is a
      finding), and the STIG discussion notes the Oracle installation does not
      assign role permissions to PUBLIC — a compliant stock database returns zero
      rows, so the compliant posture is inherited from the Oracle default
      (aws_inherited) with no org-defined value and no allowlist needed. The
      baseline control's `should be_empty` assertion is correct (baseline_status:
      fixed) and runs in BOTH postures to detect drift; it is never suppressed
      (two-axis rule). Overlay inherits as-is (overlay_status: inherited).

  # --- CUSTOMER responsibility: org-defined ALTER PROFILE limits (SV-270495 pattern) ---
  - id_pattern: "SV-270549"
    set_by: sql_hardening
    verified_by: sql
    rationale: >-
      SV-270549 (AC-7 b / CM-6 b) account lockouts must persist until reset by an
      administrator — PASSWORD_LOCK_TIME must be UNLIMITED on every user profile.
      The DISA fix is db-altering, org-defined SQL against a site profile
      (ALTER PROFILE <profile> LIMIT PASSWORD_LOCK_TIME UNLIMITED), so this is a
      CUSTOMER responsibility on the SV-270495 pattern (set_by: sql_hardening,
      verified_by: sql). The baseline check is correct (baseline_status: ok;
      per-profile DBA_PROFILES query, should cmp 'UNLIMITED'). Remediated via
      hardening/sql/10_profiles.sql (DEFAULT profile) and/or
      hardening/sql/11_ora_stig_profile.sql (assign the Oracle-supplied,
      immutable ORA_STIG_PROFILE to the site's accounts — the STIG-named vehicle;
      the profile already carries PASSWORD_LOCK_TIME UNLIMITED). skip_control
      under --skip-customer-controls; runs under --all.
  - id_pattern: "SV-270550"
    set_by: sql_hardening
    verified_by: sql
    rationale: >-
      SV-270550 (CM-6 b) maximum consecutive invalid logon attempts must be three
      (or fewer) — FAILED_LOGIN_ATTEMPTS must be <= the org-defined bound on every
      profile. The DISA fix is db-altering, org-defined SQL
      (ALTER PROFILE <profile> LIMIT FAILED_LOGIN_ATTEMPTS 3), a CUSTOMER
      responsibility on the SV-270495 pattern. The baseline stub was unwritten
      (needs_dev); implemented the FAILED_LOGIN_ATTEMPTS SQL assertion upstream in
      the mitre-baseline (fix/sv-270550-failed-login-attempts, held for PR),
      modeled on SV-270549/551 — baseline_status: fixed. Remediated via
      hardening/sql/10_profiles.sql (DEFAULT profile) and/or
      hardening/sql/11_ora_stig_profile.sql (assign the Oracle-supplied
      ORA_STIG_PROFILE, which already sets FAILED_LOGIN_ATTEMPTS 3). skip_control
      under --skip-customer-controls; runs under --all.
  - id_pattern: "SV-270551"
    set_by: sql_hardening
    verified_by: sql
    rationale: >-
      SV-270551 (IA-4 e / AC-2(3)(a)) accounts must be disabled after 35 days of
      inactivity — INACTIVE_ACCOUNT_TIME must be set and <= the org-defined age
      (account_inactivity_age, default 35) on every profile. The DISA fix is
      db-altering, org-defined SQL (ALTER PROFILE <profile> LIMIT
      INACTIVE_ACCOUNT_TIME 35, or ALTER USER ... PROFILE ORA_STIG_PROFILE), a
      CUSTOMER responsibility on the SV-270495 pattern. The baseline check is
      correct (baseline_status: fixed; per-profile DBA_PROFILES query,
      should_not cmp 'UNLIMITED' and should cmp <= account_inactivity_age).
      Remediated via hardening/sql/10_profiles.sql (DEFAULT profile) and/or
      hardening/sql/11_ora_stig_profile.sql (assign the Oracle-supplied
      ORA_STIG_PROFILE, which already sets INACTIVE_ACCOUNT_TIME 35 — the STIG's
      "ALTER USER ... PROFILE ORA_STIG_PROFILE" remediation). skip_control under
      --skip-customer-controls; runs under --all.

  # --- SQL parameter/account controls verified in SQL, inherited from platform ---
  - id_pattern: "SV-270535"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270535 (CM-6 b) the undocumented Oracle _TRACE_FILES_PUBLIC parameter, if
      present, must be FALSE. The DISA check is a pure SQL predicate
      (SELECT value FROM v$parameter WHERE name = '_trace_files_public'; TRUE is a
      finding, and "parameter does not exist or is FALSE" is not a finding).
      _trace_files_public is a hidden parameter that is FALSE by default and not
      set on a stock brokered RDS instance, so the compliant posture is inherited
      from the Oracle/RDS default (aws_inherited) with no org-defined value. The
      baseline control's `should_not cmp 'TRUE'` assertion is correct
      (baseline_status: ok) and runs in BOTH postures to detect drift; it is never
      suppressed (two-axis rule). The DISA fix requires an spfile edit +
      shutdown/startup (unreachable on managed RDS), reinforcing that the compliant
      default is platform-owned, not a tenant SQL remediation. Overlay inherits
      as-is (overlay_status: inherited).
  - id_pattern: "SV-270540"
    set_by: aws_rds_parameter_group
    verified_by: sql
    rationale: >-
      SV-270540 (CM-6 b) changes to configuration options must be audited. The DISA
      check is dual-mode: for unified/mixed auditing, >=1 enabled unified policy
      for entity SYS; for standard auditing, audit_sys_operations = TRUE. On managed
      RDS the DB runs unified auditing in MIXED mode (consistent with SV-270510's
      unified_auditing_used=true posture), and SYS-operation auditing is delivered
      by the broker-managed audit policy set on the parameter/option group
      (aws_rds_parameter_group). The baseline control was corrected to a
      `describe.one` that passes under EITHER audit mode (baseline_status: fixed):
      branch A asserts unified_sys_policy_count >= 1, branch B asserts
      audit_sys_operations = TRUE. It is SQL-verified in BOTH postures and never
      suppressed (two-axis rule). Overlay inherits as-is (overlay_status:
      inherited).
  - id_pattern: "SV-270545"
    set_by: aws_inherited
    verified_by: sql
    rationale: >-
      SV-270545 (IA-5(1)(d) / CM-6 b, severity high) Oracle-supplied default
      accounts must have custom (nondefault) passwords. The DISA check is a SQL
      predicate over SYS.DBA_USERS_WITH_DEFPWD — any account other than XS$NULL
      listed is a finding. XS$NULL is an internal non-authenticatable account and
      is the sole allowed value. On a stock brokered RDS instance the Oracle
      predefined accounts are created LOCKED with non-default (RDS-randomized/
      expired) credentials, so a compliant instance returns only XS$NULL — the
      compliant posture is inherited from the Oracle/RDS provisioning default
      (aws_inherited). The baseline control's `describe.one` is correct
      (baseline_status: ok): branch A requires every listed account to be XS$NULL,
      branch B requires the list be empty; together they pass iff the only entry is
      XS$NULL (or none), and fail on any other default-password account. It is
      SQL-verified in BOTH postures and never suppressed (two-axis rule) so any
      customer-created account left on a default password is still a real finding
      the tenant must remediate. Overlay inherits as-is (overlay_status: inherited).
      Note: verified against DISA text + baseline logic only; a live brokered
      GovCloud RDS run (aws-broker#558) would confirm the stock DBA_USERS_WITH_DEFPWD
      contents but is not required to inherit a correct detect-first check.
  - text_pattern: "granted to PUBLIC|PUBLIC grant|revoke.*public"
    set_by: sql_assessment_only
    verified_by: sql
    rationale: >-
      PUBLIC grants are detected (40_public_grants_assess.sql) but never
      auto-revoked; revocation requires an explicit allowlist (app-breakage risk).
      Broad default for PUBLIC-grant controls; the three explicitly-dispositioned
      PUBLIC controls have id_pattern overrides above (SV-270528, SV-270530,
      SV-270532).

  # --- manual / compensating-control dispositions (documentation / SSP) ---
  - id_pattern: "SV-270498"
    set_by: manual_review
    verified_by: manual_review
    rationale: >-
      SV-270498 (AC-16) security labels on data in storage. Procedural DISA
      check: if no data is classified sensitive/CUI or labeling is not required
      per system documentation, this is Not a Finding. Not SQL-verifiable and
      not a managed-RDS platform fact; satisfied by the Cloud.gov SSP
      data-classification posture. Overridden to Manual (impact 0.0) in
      controls/overlay.rb.
  - id_pattern: "SV-270503"
    set_by: manual_review
    verified_by: manual_review
    rationale: >-
      SV-270503 (AU-12 b) designated personnel can SELECT which auditable events
      are audited. Procedural DISA check with no pass/fail SQL query: verify (via
      DBMS settings + documentation) that designated personnel can select audited
      events. In Oracle the capability is inherent — AUDIT ANY / AUDIT SYSTEM
      (and AUDIT_ADMIN for unified auditing) holders configure auditing via
      AUDIT / CREATE AUDIT POLICY; any user can audit their own schema. The broker
      issues the customer a privileged account able to manage unified-audit
      policies (the platform-set audit posture, SV-270504 — ORA_SECURECONFIG /
      ORA_LOGON_FAILURES are enabled by default on RDS once audit_trail is set),
      satisfying this capability. A
      documentation/policy determination (audit-management authorization), not a
      tenant SQL assertion. Overridden to Manual (impact 0.0) in
      controls/overlay.rb.
  - id_pattern: "SV-270505"
    set_by: manual_review
    verified_by: manual_review
    rationale: >-
      SV-270505 (AU-3(1)) organization-defined additional, more detailed audit
      information. Conditional/procedural DISA check: "Review the system
      documentation to identify additional site-specific information not covered
      by the default audit options... If there are none, this is not a finding."
      Only if additional detailed-audit requirements are defined does it compare
      them against existing Fine-Grained Auditing (FGA) specs. No additional
      site-specific detailed-audit requirement beyond the default unified-audit
      options is defined for Cloud.gov RDS, so the not-a-finding clause is
      satisfied — a documentation/policy determination, not a tenant SQL
      assertion. The inherited baseline body runs an UNCONDITIONAL FGA-count
      query that would FAIL whenever no FGA policy exists (misleading on RDS,
      since the STIG treats that as Not a Finding absent additional
      requirements). Overridden to Manual (impact 0.0) in controls/overlay.rb.
      If additional detailed-audit requirements are later defined, deploying and
      verifying FGA becomes the customer's responsibility.
  - id_pattern: "SV-270499"
    set_by: aws_inherited
    verified_by: compensating_control
    rationale: >-
      SV-270499 (AC-2(1)) organization-level authentication/account management.
      PLATFORM responsibility, not customer. Database accounts are provisioned
      and authenticated through the standard CloudFoundry brokered-credentials
      model — the enterprise-level authentication/access mechanism the DISA
      check's "not a finding" clause anticipates. That model is
      FedRAMP-authorized/certified and is part of the ATO granted to Cloud.gov by
      the customer's agency; it is satisfied by the platform, not by tenant SQL.
      Overridden to a platform disposition (impact 0.0) in controls/overlay.rb.

  - id_pattern: "SV-270500"
    set_by: broker_infra
    verified_by: compensating_control
    rationale: >-
      SV-270500 (AC-3 / AC-6(10)) enforce approved authorizations for logical
      access. Procedural DISA check: review roles/profiles (or Oracle Database
      Vault) for appropriateness/completeness of access permitted and denied each
      user type. On brokered Cloud.gov RDS the broker provisions the database with
      reviewed roles/profiles and issues a single customer user account via
      `cf create-service`; the baseline authorization set is satisfied at provision
      by the platform, not a tenant SQL assertion. Customer-created users/roles are
      the customer's responsibility. Overridden to a platform disposition (impact
      0.0) in controls/overlay.rb.
  - id_pattern: "SV-270501"
    set_by: broker_infra
    verified_by: compensating_control
    rationale: >-
      SV-270501 (AU-10 / IA-2(5)) nonrepudiation for shared accounts. Procedural
      DISA check whose opening clause is "If there are no shared accounts available
      to more than one user, this is not a finding." The broker provisions a single
      customer user account (not a shared account) at provision, satisfying that
      clause. The supporting audit-enabled requirement (audit_trail != NONE) stays
      SQL-verified via SV-270502 (inherited) and the audit_trail entry above. If the
      customer creates additional users, individual attribution for them is the
      customer's responsibility. Overridden to a platform disposition (impact 0.0)
      in controls/overlay.rb.

  # --- not applicable / inherited on RDS ---
  - id_pattern: "SV-270506"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270506 (AU-4) audit record storage capacity. DISA check assesses the
      AUD$/AUDSYS tablespace placement (must not be SYSTEM/USERS), the
      audit_file_dest OS location and its free space, and whether the DBMS ever
      ran out of audit-log space — all storage-capacity facts that on managed RDS
      are AWS/broker-owned: DB storage is broker-provisioned with RDS storage
      autoscaling, and the AUDSYS/AUD$ tablespaces plus audit_file_dest live under
      SYS/AUDSYS and the DB host OS, AWS-managed and tenant-unreachable. The DISA
      fix (dbms_audit_mgmt.move_dbaudit_tables, resize disk) needs SYS/OS access
      the tenant lacks. Inherited from the AWS platform. Overridden to N/A
      (impact 0.0) in controls/overlay.rb.
  - id_pattern: "SV-270507"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270507 (AU-4(1)) off-load audit data to a centralized log management
      facility, continuous/near-real-time when networked. Procedural DISA check
      (review system documentation for how audit records are off-loaded). On
      managed RDS this is an AWS platform capability: RDS for Oracle publishes the
      audit trail to Amazon CloudWatch Logs continuously/near-real-time via the DB
      instance log exports, feeding the Cloud.gov centralized logging posture
      (AU-4(1)/AU-6). A broker/platform integration configured outside the
      database, not a tenant SQL setting and not SQL-verifiable. Inherited from
      the AWS/Cloud.gov platform. Overridden to N/A (impact 0.0) in
      controls/overlay.rb.
  - id_pattern: "SV-270508"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270508 (AU-5(1)) warning at 75 percent of allocated audit-log storage.
      Procedural DISA check: review OS or third-party logging application settings
      for a capacity warning. On managed RDS, local audit storage and OS-level
      alerting are AWS-managed, and audit records are off-loaded through the RDS
      log-export / CloudWatch Logs integration. Capacity monitoring and alerting
      for that managed path are inherited from AWS/Cloud.gov, not tenant SQL. See
      controls/overlay.rb `SV-270508`.
  - id_pattern: "SV-270509"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270509 (AU-5(2)) real-time alert on audit failure. Procedural DISA check:
      review Oracle, OS, or third-party logging software settings for real-time
      alert delivery. On managed RDS, audit collection/log export and monitoring
      are broker/AWS platform integrations outside tenant database control; no
      tenant SQL assertion proves the external alerting path. See
      controls/overlay.rb `SV-270509`.
  - id_pattern: "SV-270511"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270511 (AU-9 a/b/c) protect audit tools. Procedural DISA check: review
      permissions on tools used to view or modify audit log data. For brokered RDS,
      the platform audit tooling is the managed AWS/Cloud.gov logging stack and
      AWS-managed host/Oracle tooling tenants cannot access; protection is inherited
      from the platform. See controls/overlay.rb `SV-270511`.
  - id_pattern: "SV-270513"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270513 (SA-22 a) Oracle Database products must be vendor-supported. For
      brokered RDS, customers run AWS-exposed Oracle engine versions; AWS has
      policies/procedures for RDS Oracle support, deprecation, patching, and
      required upgrade paths to ensure customers are running supported versions.
      See controls/overlay.rb `SV-270513`.
  - id_pattern: "SV-270514"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270514 (CM-5(6)) monitor DBMS software/configuration files for
      unauthorized changes. Oracle software libraries and configuration files are
      on AWS-managed RDS hosts tenants cannot access; monitoring is inherited from
      AWS/Cloud.gov operational controls. See controls/overlay.rb `SV-270514`.
  - id_pattern: "SV-270516"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270516 (CM-5(6)) restrict use of the Oracle software installation
      account. The software owner / host SYSDBA-capable installation account is
      AWS-managed and unavailable to tenants on RDS; the broker-created database
      user is not that account. See controls/overlay.rb `SV-270516`.
  - id_pattern: "SV-270512"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270512 (CM-5) logical access restrictions on DBMS configuration/software.
      DISA check is OS/filesystem only (`ls -ld` on the Oracle software install
      directory; fix sets the software-owner umask) and the tenant has no OS/host
      access on managed RDS — the Oracle Home and its permissions are AWS-managed
      and unreachable. The inherited baseline `command('umask')` assertion would
      reflect the InSpec runner host, not the DB server, so it is not a valid
      signal. Access restrictions to the DBMS software are inherited from the AWS
      platform. Overridden to N/A (impact 0.0) in controls/overlay.rb.
  - id_pattern: "SV-270515"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270515 (CM-5(6)) OS privileges over DBMS software libraries. DISA check
      enumerates OS accounts with access to the software library (`cat /etc/group
      | grep -i dba`, `cat /etc/passwd`) — an OS/host review unreachable on managed
      RDS (no OS access; software library, /etc/group, /etc/passwd are
      AWS-managed). The inherited baseline body substitutes a mismatched SQL check
      (DBA-role grantees via dba_role_privs) that does NOT assess the STIG's OS
      software-library file permissions (references/HANDOFF.md §6 needs_fix seed);
      DBA-role membership is covered by the dedicated account/role controls. The
      software-library privilege restriction is inherited from the AWS platform.
      Overridden to N/A (impact 0.0) in controls/overlay.rb.
  - id_pattern: "SV-270496"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      DoS mitigation (SC-5/AC-10). Baseline check reads
      $ORACLE_HOME/network/admin/listener.ora for a connection RATE_LIMIT /
      CONNECTION_RATE_LISTENER; the listener is AWS-managed on RDS and
      unreachable by the tenant (no OS/listener access). The listener-level DoS
      rate limit is inherited from the AWS platform and is not SQL-verifiable.
      The STIG's other DoS levers (profile CPU_PER_CALL/IDLE_TIME/LOGICAL_READS,
      tablespace quotas) are org-defined resource limits on the
      customer-responsibility profile-hardening path (see SV-270495), not this
      control's listener.ora assertion. Overridden to N/A (impact 0.0) in
      controls/overlay.rb.
  - id_pattern: "SV-275999"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-275999 (CM-6 b) a minimum of three Oracle control files, each on a
      SEPARATE physical and logical device (RAID 1+0). The count (>=3) is
      SQL-visible via SELECT name FROM v$controlfile, but the STIG's actual
      requirement — device separation — is a storage-topology fact the DISA check
      itself directs a reviewer to confirm with the storage/system/database
      administrator (file paths do not prove device separation). On managed RDS
      the tenant has no visibility into or control over the underlying storage:
      control-file count, multiplexing, and physical/logical device placement are
      AWS-managed (Oracle-Managed Files on RDS-provisioned storage with AWS-side
      redundancy), and the v$controlfile paths cannot be mapped by the tenant to
      distinct devices. Control-file redundancy/separation is inherited from the
      AWS platform. The baseline stub was unwritten (needs_dev); a count-only SQL
      assertion cannot see the device-separation requirement, so the overlay
      OVERRIDES to N/A (impact 0.0) in BOTH postures (controls/overlay.rb). Placed
      as an explicit id_pattern so it is unambiguous. overlay_status: N/A (platform).
  - id_pattern: "SV-270539"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270539 (CM-6 b) network access to the database must be restricted to
      authorized personnel. The DISA check enforces IP-address restriction at the
      network layer — the listener SQLNET.ORA (tcp.validnode_checking=YES /
      tcp.invited_nodes) in $ORACLE_HOME/network/admin, an Oracle Connection
      Manager CMAN.ORA RULE set, or an external network device — none reachable by
      the tenant on managed RDS. The inherited baseline reads the runner host's
      sqlnet.ora (no tenant-managed file on RDS), a misleading signal. Network
      access restriction is an AWS platform function: the listener is AWS-managed
      and unreachable, and inbound access is governed by VPC security groups and
      the Cloud.gov brokered private-networking posture, not a tenant SQL/OS
      setting. Overridden to N/A (impact 0.0) in BOTH postures (controls/overlay.rb).
      Placed as an explicit id_pattern before the broad tnslsnr/lsnrctl default so
      it is unambiguous. overlay_status: N/A (platform).
  - id_pattern: "SV-270541"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270541 (CM-6 b) the /diag subdirectory under DIAGNOSTIC_DEST must be
      protected from unauthorized access. The DISA check reads DIAGNOSTIC_DEST via
      SQL, then inspects OS filesystem permissions on <DIAGNOSTIC_DEST>/diag
      (`ls -ld` on Unix, Explorer ACLs on Windows); the fix alters host filesystem
      permissions. Both require OS/filesystem access to the DB host, which the
      tenant lacks on managed RDS — the diagnostic/diag directory and its
      permissions are AWS-managed and unreachable, and the inherited baseline
      command('ls -ld <DIAGNOSTIC_DEST>/diag') assertion reflects the InSpec runner
      host, not the DB server, so it is not a valid signal. Filesystem protection of
      the diagnostic directory is inherited from the AWS platform. Overridden to N/A
      (impact 0.0) in BOTH postures (controls/overlay.rb). Placed as an explicit
      id_pattern before the broad OS/file-permission default so it is unambiguous.
      overlay_status: N/A (platform).
  - id_pattern: "SV-270542"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: >-
      SV-270542 (CM-6 b) remote administration must be disabled for the Oracle
      Connection Manager (REMOTE_ADMIN = NO in cman.ora). The DISA check reads
      cman.ora in $ORACLE_HOME/network/admin and is explicitly Not a Finding when
      the file does not exist (Connection Manager not in use). On managed RDS Oracle
      Connection Manager is not deployed and the tenant has no OS access to place or
      read a cman.ora; any Connection Manager in the AWS network path is AWS-managed
      and unreachable. The inherited baseline reads cman.ora on the runner host and
      asserts `should exist`, which FAILS on a missing file even though the STIG
      treats that as Not a Finding — a misleading signal. Connection Manager
      configuration is inherited from the AWS platform. Overridden to N/A
      (impact 0.0) in BOTH postures (controls/overlay.rb). Placed as an explicit
      id_pattern before the broad tnslsnr/lsnrctl default so it is unambiguous.
      overlay_status: N/A (platform).
  - text_pattern: "listener|tnslsnr|lsnrctl"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: Listener is AWS-managed on RDS; no tenant access.
  - text_pattern: "operating system|OS file|file permission|directory permission"
    set_by: aws_inherited
    verified_by: not_applicable_rds
    rationale: Host OS is AWS-managed on RDS; inherited control.
