name: cg-oracle-19c-stig-runner

# Local STIG-profile runner (#7). Brings up Oracle 23ai Free (gvenzl) and runs
# the overlay profile through CINC Auditor.
#
# FIDELITY: this targets Oracle 23ai Free, NOT 19c / SE2 / RDS. It validates that
# the check LOGIC executes and is coherent. RDS- and version-specific behavior is
# deferred to the live proof (aws-broker#558). NOT compliance evidence.
#
# Run from the REPO ROOT so the runner build context can see inspec.yml/controls:
#   docker compose -f runner/docker-compose.yml up --build --abort-on-container-exit

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: devpw_ChangeMe1
      APP_USER: stig
      APP_USER_PASSWORD: devpw_ChangeMe1
    ports:
      # loopback only — local dev DB with a known password must not be on the LAN
      - "127.0.0.1:1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  runner:
    build:
      # repo root: the runner Dockerfile copies inspec.yml/inspec.lock/controls
      # (the overlay profile) plus runner/oraquery + runner scripts.
      context: ..
      dockerfile: runner/Dockerfile
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      # gvenzl exposes the pluggable DB service as FREEPDB1; SYSTEM is DBA-class
      # (analogous to the RDS master user the real scan will use).
      DB_USER: system
      DB_PASSWORD: devpw_ChangeMe1
      DB_HOST: oracle
      DB_SERVICE: FREEPDB1
      DB_PORT: "1521"
