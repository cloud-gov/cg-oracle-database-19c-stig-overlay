---
# allowed_dbaobject_owners (SV-270518) is seeded in run-validation.sh, not here:
# the list must include the per-instance broker DB_USER, which a committed file
# cannot interpolate. See RDS_OBJECT_OWNERS there (single source of truth).
required_audit_policies:
  - ORA_SECURECONFIG
  - ORA_LOGON_FAILURES
customer_audit_policies:
  - CG_AUDIT_POLICY
# approved_password_verify_functions (SV-270561 / SV-270587) holds FUNCTION names
# compared against DBA_PROFILES.LIMIT for resource_name =
# 'PASSWORD_VERIFY_FUNCTION'. A PROFILE name (e.g. ORA_STIG_PROFILE) can never
# match — allowlist the function that profile binds instead (see inspec.yml and
# cg-overlay#77).
approved_password_verify_functions:
  - ORA12C_STIG_VERIFY_FUNCTION
users_allowed_access_to_public:
  - SYS
  - SYSTEM
  - CTXSYS
  - GSMADMIN_INTERNAL
  - XDB
  - RDSADMIN
