name: cg-oracle-database-19c-stig-overlay
title: Cloud.gov Oracle Database 19c STIG Overlay
maintainer: cloud.gov
copyright: cloud.gov
copyright_email: cloud-gov-support@gsa.gov
license: Apache-2.0
summary: >-
  Cloud.gov overlay for the DISA Oracle Database 19c STIG. Depends on the
  cloud-gov fork of the MITRE baseline and requires all of its runnable
  (oracledb_session) controls via the depends -> overlay -> SQL-verify path.
version: 0.1.0
inspec_version: ">= 4.0"

# Consume the cloud-gov fork's `cloudgov` branch (the upstream MITRE profile does
# not load: a mismatched-quote syntax error blocks it before any control runs --
# mitre/oracle-database-19c-stig-baseline#1). We do NOT vendor the baseline.
depends:
  - name: oracle-database-19c-stig-baseline
    git: https://github.com/cloud-gov/oracle-database-19c-stig-baseline.git
    branch: cloudgov

# The overlay pulls in ALL baseline controls as they are defined there, via
# `include_controls` in controls/overlay.rb (no per-control filter). The baseline
# `cloudgov` branch forwards `port: input('port')` into every connect string, so
# this overlay's `port` input flows straight through.

# Inputs consumed by the inherited controls via oracledb_session. Values are
# supplied at scan time (CLI/attributes/env), never committed. Defaults are empty
# and non-sensitive metadata only.
inputs:
  - name: user
    description: 'Oracle DB username (RDS master user; not SYS)'
    value: ''
    sensitive: true
  - name: password
    description: 'Oracle DB password'
    value: ''
    sensitive: true
  - name: host
    description: 'Oracle DB hostname (RDS endpoint)'
    value: ''
    sensitive: true
  - name: service
    description: 'Oracle DB service name'
    value: ''
  - name: port
    description: 'Oracle DB port (1521 plaintext; 2484 TCPS/TLS)'
    value: 1521
  - name: sqlplus_bin
    description: 'Path to the query client binary (sqlplus / go-ora shim)'
    value: ''
    sensitive: true
  # Org-defined session idle-termination limit (minutes) for SV-270497
  # (max_idle_time). The STIG says assume 15 when the organization has not
  # documented a value. Applied at the PLATFORM layer via the RDS DB parameter
  # group (max_idle_time is a modifiable, dynamic RDS parameter); this input is
  # the org-defined target the GV$PARAMETER verification checks against.
  - name: max_idle_time_minutes
    description: >-
      Organization-defined maximum idle minutes before Oracle terminates a
      session (SV-270497 / max_idle_time). Defaults to 15 per the STIG when no
      site value is documented.
    value: 15
  # Responsibility gate — see docs/RESPONSIBILITY.md. Set at scan time by
  # run-validation.sh --skip-customer-controls (or SKIP_CUSTOMER_CONTROLS=1).
  - name: skip_customer_responsibility_controls
    description: >-
      When true, skip customer-responsibility controls (docs/RESPONSIBILITY.md).
      When false (default), run the full baseline.
    value: false
  # --- Auditing posture (SV-270510 audit-store checks) -----------------------
  # RDS for Oracle runs UNIFIED auditing in MIXED mode. Pure-mode unified auditing
  # needs a binary relink with uniaud_on, which RDS does not support (AWS
  # "Security auditing in Amazon RDS for Oracle, Part 1"). Our compliance posture
  # assesses the UNIFIED trail (AUDSYS-owned objects: AUD$UNIFIED and the
  # *UNIFIED_AUDIT_TRAIL views), so SV-270510 checks AUDSYS grants only.
  - name: standard_auditing_used
    description: >-
      Assess standard-auditing store (SYS.AUD$). False on RDS: we use unified
      auditing (mixed mode), so the AUD$ trail is not our compliance store.
    type: Boolean
    value: false
  - name: unified_auditing_used
    description: >-
      Assess unified-auditing store (AUDSYS-owned AUD$UNIFIED / UNIFIED_AUDIT_TRAIL).
      True on RDS (mixed-mode unified auditing).
    type: Boolean
    value: true
  # Authorized database object owners (SV-270518 / CM-5(6)). The profile default
  # is empty; run-validation.sh seeds the 14 pre-provisioned object owners observed
  # on a stock brokered RDS instance PLUS the per-instance broker DB_USER (which a
  # committed file cannot interpolate) into /tmp/inputs.yml at scan time — the
  # baseline asserts EVERY DBA_OBJECTS owner is allowlisted, so the connecting user
  # must be present or the control fails on its first owned object. Site-authorized
  # application/schema owners can be supplied via an additional input file.
  - name: allowed_dbaobject_owners
    description: >-
      Database object owners authorized for SV-270518. run-validation.sh seeds the
      pre-provisioned owner list for a stock RDS instance plus the connecting
      DB_USER; add site-authorized application/schema owners via an input file.
    type: Array
    value: []
  # Authorized grantees on the UNIFIED audit store (AUDSYS-owned objects) for
  # SV-270510 (AU-9). Observed on a stock brokered RDS instance (DBA_TAB_PRIVS
  # where owner='AUDSYS'):
  #   - Oracle built-in audit roles — EXECUTE_CATALOG_ROLE, AUDIT_ADMIN,
  #     AUDIT_VIEWER (default Oracle grants; EXECUTE on DBMS_AUDIT_MGMT, READ on
  #     the *_UNIFIED_AUDIT_TRAIL / *_XS_AUDIT_TRAIL views).
  #   - RDSADMIN — the AWS-managed RDS administrative account.
  #   - the broker-provisioned application user — per-instance name (e.g.
  #     U0NUFB6OO3Y0ZJUE); run-validation.sh appends the connecting DB_USER.
  # KNOWN DEVIATION (accepted): on RDS the master/broker user is granted SELECT +
  # DELETE on AUD$UNIFIED by the RDS-default audit setup. DELETE on the audit
  # store is an AU-9 concern, but it is an RDS platform default the tenant cannot
  # REVOKE (RDS manages AUDSYS); accepted as a documented deviation, not a
  # remediable finding. See control-layers.yml SV-270510 and docs/RESPONSIBILITY.md.
  # Any grantee OUTSIDE this list is still a real finding.
  - name: allowed_audit_users
    description: >-
      Grantees authorized to hold privileges on the unified audit store
      (AUDSYS-owned AUD$UNIFIED / UNIFIED_AUDIT_TRAIL). Defaults to the Oracle
      built-in audit roles plus the RDSADMIN platform account; the runner also
      appends the broker-provisioned DB_USER at scan time. Append site-authorized
      accounts via an input file.
    type: Array
    value:
      - EXECUTE_CATALOG_ROLE
      - AUDIT_ADMIN
      - AUDIT_VIEWER
      - RDSADMIN
  # --- DOD-selected audit event set (SV-270504) ------------------------------
  # NOTE: SV-270504 runs inside the depended-on baseline (via include_controls),
  # whose input namespace does NOT see these overlay defaults. So these values are
  # ALSO written into /tmp/inputs.yml by run-validation.sh (a runtime --input-file
  # is cross-profile) and the control carries inline value: defaults as a backstop.
  # These inspec.yml entries document the intended defaults and type; do not rely
  # on them alone to reach the control.
  # Org-defined set of unified-audit policies that must be ENABLED (present in
  # AUDIT_UNIFIED_ENABLED_POLICIES) to cover the DOD-selected auditable-event list
  # (AU-12 c). On RDS the Oracle-provided policies below are enabled BY DEFAULT
  # once the broker's audit_trail parameters are set (RDS parameter group) — a
  # PLATFORM fact, not a tenant hardening step:
  #   - ORA_SECURECONFIG   — privilege GRANT/REVOKE, security-config/DDL, account
  #                          administration, ALTER SYSTEM/DATABASE parameter changes
  #   - ORA_LOGON_FAILURES — logon success/failure events
  # Extend this list to add site-specific object/FGA policies (which would then be
  # tenant-owned) without editing the SV-270504 overlay control.
  - name: required_audit_policies
    description: >-
      Unified-audit policies that must be enabled to cover the DOD-selected
      auditable-event set (SV-270504 / AU-12 c). Defaults to the Oracle-provided
      ORA_SECURECONFIG and ORA_LOGON_FAILURES policies, which are enabled by
      default on RDS once the audit_trail parameters are set; extend with
      site-specific policies as needed.
    type: Array
    value:
      - ORA_SECURECONFIG
      - ORA_LOGON_FAILURES
  # Customer-responsibility unified-audit policies checked ONLY in the
  # customer/--all posture (skip_customer_responsibility_controls=false). These are
  # the site/tenant-owned policies that cover the STIG-required auditable events the
  # RDS default policies MISS (SV-270504 / AU-12 c). hardening/sql/30_audit_policies.sql
  # creates and enables CG_AUDIT_POLICY (REVOKE, CHANGE PASSWORD, LOGOFF,
  # CREATE SPFILE). A platform-only run does not assert these (the tenant
  # has not yet applied its hardening); a customer/--all run does. The default below
  # matches 30_audit_policies.sql; a site that names its policy differently changes
  # this default (the runner is baked into the image, so inputs are not supplied at
  # runtime). When empty, the second assertion is skipped.
  - name: customer_audit_policies
    description: >-
      Site/tenant-owned unified-audit policies that must be enabled to cover the
      STIG-required auditable events missing from the RDS defaults (SV-270504 /
      AU-12 c). Asserted ONLY in the customer/--all posture. Defaults to the
      CG_AUDIT_POLICY created by hardening/sql/30_audit_policies.sql; a site that
      uses a different policy name sets that here. Empty skips the customer-posture
      assertion.
    type: Array
    value:
      - CG_AUDIT_POLICY
  # --- Authorized installed components (SV-270553) ---------------------------
  # Org-defined allowlist of Oracle component comp_ids that are documented and
  # authorized to remain installed (CM-7 a). SV-270553 runs the DISA dba_registry
  # query (which already excludes the core comp_ids CATJAVA/CATALOG/CATPROC/SDO/
  # DV/XDB and OPTION OFF rows) and FAILS on any returned comp_id not in this list.
  # On managed RDS the component set is fixed at database creation by AWS and is
  # NOT tenant-removable; a brokered instance ships Oracle Text (CONTEXT) installed
  # and VALID, so CONTEXT is the default authorized member. Add site-authorized
  # components here (the runner is baked into the image, so inputs are not supplied
  # at runtime). NOTE: SV-270553 runs inside the depended-on baseline (via
  # include_controls), whose input namespace does NOT see this overlay default, so
  # the control also carries an inline value: default and run-validation.sh writes
  # the key into /tmp/inputs.yml.
  - name: authorized_components
    description: >-
      Oracle component comp_ids (dba_registry) documented and authorized to remain
      installed (SV-270553 / CM-7 a). Defaults to CONTEXT (Oracle Text), which is
      default-installed on RDS and not tenant-removable. Any installed component
      outside this list (beyond the STIG-excluded core comp_ids) is a finding.
    type: Array
    value:
      - CONTEXT
