# Control -> implementation-layer map for the STIG-hardened Oracle 19c RDS offering.
# 'controls_by_id' = explicit per-control classifications from the validation run (overlay #6/#9);
# 'default_layer_rules' apply to the rest.
metadata:
  status: draft
  stig: Oracle Database 19c STIG
  benchmark_version: unverified
  benchmark_citation_needed: true
  platform: aws-rds-oracle-19c
  partition_note: GovCloud (aws-us-gov); verify option/param availability per region.
  source_epic: https://github.com/cloud-gov/aws-broker/issues/519
default_layer_rules:
- when_check_contains:
  - tnslsnr
  - lsnrctl
  - listener.ora
  - sqlnet.ora
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: "Listener/sqlnet-level. On managed RDS the tenant has no OS or listener access; the listener\
    \ is AWS-managed. Neither settable nor SQL-verifiable by the tenant \u2192 report not applicable /\
    \ inherited."
- when_check_contains:
  - ps -ef
  - /etc/oratab
  - $ORACLE_HOME/
  - audit.rules
  - chmod
  - chown
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: OS/filesystem-level check requiring host access. The underlying host is AWS-managed on RDS;
    satisfied by inherited controls, not tenant-checkable.
- when_check_contains:
  - oracledb_session
  set_by: sql_hardening
  verified_by: sql
  rationale: Default for SQL-connectable controls not otherwise classified.
controls:
- text_pattern: audit_trail
  set_by: aws_rds_parameter_group
  verified_by: sql
  rationale: "audit_trail is applied by the broker parameter group but is readable via SELECT value FROM\
    \ v$parameter \u2014 keep verifying it in SQL to detect drift."
- text_pattern: sec_case_sensitive_logon
  set_by: aws_rds_parameter_group
  verified_by: sql
  rationale: Set by parameter group; verifiable in V$PARAMETER.
- text_pattern: remote_login_passwordfile
  set_by: aws_rds_parameter_group
  verified_by: sql
  rationale: Set by parameter group; verifiable in V$PARAMETER.
- text_pattern: sql92_security
  set_by: aws_rds_parameter_group
  verified_by: sql
  rationale: Set by parameter group; verifiable in V$PARAMETER.
- text_pattern: tablespace encryption|encrypted|TDE|at rest
  set_by: broker_infra
  verified_by: aws_inherited
  rationale: Storage encryption at rest is enabled by the broker (encrypted:true, KMS) at provision; validated
    from AWS metadata, not SQL.
- text_pattern: during transmission|SSLFIPS_140|SQLNET.SSL_VERSION|TCPS|SSL_SERVER_DN_MATCH|encrypt.*transmission|transmission.*encrypt
  set_by: aws_rds_option_group
  verified_by: not_applicable_rds
  rationale: "SC-8/SC-8(1) (in transit) + SC-13 (FIPS crypto) satisfied by the broker SSL option group\
    \ \u2014 TLS 1.2, FedRAMP+FIPS cipher, FIPS.SSLFIPS_140=TRUE on a TCPS 2484 listener. sqlnet.ora/fips.ora\
    \ are AWS-managed on RDS (not SQL-visible); evidenced by option-group config + a client TCPS handshake.\
    \ DISA Oracle 19c STIG V-270579 (SC-8(2)) + V-270571 (SC-13). Depends on platform SG (2484 open /\
    \ 1521 denied) for a true TLS-only posture (aws-broker#541)."
- text_pattern: audit trail data must be retained|retention
  set_by: manual_review
  verified_by: manual_review
  rationale: Log retention is an operational/CloudWatch policy decision; manual review against the CloudWatch
    log-group retention config.
- text_pattern: FAILED_LOGIN_ATTEMPTS|PASSWORD_LIFE_TIME|password.*lifetime|profile limit
  set_by: sql_hardening
  verified_by: sql
  rationale: Profile limits enforced by hardening/sql/10_profiles.sql.
- text_pattern: unified audit|audit policy|ORA_SECURECONFIG|ORA_LOGON_FAILURES
  set_by: sql_hardening
  verified_by: sql
  rationale: Unified audit policies enabled by hardening/sql/30_audit_policies.sql.
- text_pattern: instance name.*version|Oracle version number|V\$INSTANCE
  set_by: aws_inherited
  verified_by: sql
  rationale: Version is AWS-managed but readable via V$INSTANCE/V$VERSION.
- text_pattern: granted to PUBLIC|PUBLIC grant|revoke.*public
  set_by: sql_assessment_only
  verified_by: sql
  rationale: PUBLIC grants are detected (40_public_grants_assess.sql) but never auto-revoked; revocation
    requires an explicit allowlist (app-breakage risk).
- text_pattern: listener|tnslsnr|lsnrctl
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: Listener is AWS-managed on RDS; no tenant access.
- text_pattern: operating system|OS file|file permission|directory permission
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: Host OS is AWS-managed on RDS; inherited control.
controls_by_id:
- control_id: SV-270565
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: Encrypted password transit verified via sqlnet.ora on the DB host; no OS access on managed
    RDS.
- control_id: SV-270566
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: PKI private-key protection is a host filesystem/wallet check; N/A on managed RDS.
- control_id: SV-270571
  set_by: aws_inherited
  verified_by: manual_review
  rationale: FIPS mode needs fips.ora/sqlnet.ora host files; DBFIPS_140 param is visible but file portions
    are host-level. Confirm KMS/FIPS posture out-of-band.
- control_id: SV-270578
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: OS/filesystem permissions on datafiles/logs; no host access on managed RDS.
- control_id: SV-270589
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: Trust-anchor/wallet cert store is a host filesystem check; N/A on managed RDS.
- control_id: SV-275999
  set_by: aws_inherited
  verified_by: not_applicable_rds
  rationale: Control-file redundancy on separate physical devices needs OS storage inspection; AWS-managed
    storage on RDS.
- control_id: SV-270505
  set_by: sql_hardening
  verified_by: requires_live_rds
  rationale: UNIFIED_AUDIT_TRAIL not accessible on the local 23ai harness (ORA-00942); defer audit-record-detail
    verification to the live RDS SE2 proof (aws-broker#558). Not evaluated locally to avoid a version-specific
    false result.
- control_id: SV-270556
  set_by: sql_hardening
  verified_by: requires_live_rds
  rationale: Upstream query reads SYS.USER$/OBJ$/OBJAUTH$; the RDS master user lacks READ on SYS.USER$
    (ORA-41900). Verify a DBA_*-view equivalent against a live RDS SE2 instance (aws-broker#558) rather
    than guess.
